name: CI → Staging

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ---- AWS auth ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Build test image ----
      - name: Build test image
        run: docker build --target test -t $ECR_REPOSITORY:test .

      # ---- Run tests (hard gate) ----
      - name: Run tests
        run: docker run --rm $ECR_REPOSITORY:test

      # ---- Build prod image (only if tests pass) ----
      - name: Build prod image
        run: docker build --target prod -t $ECR_REPOSITORY:$IMAGE_TAG .

      # ---- Tag + push to ECR ----
      - name: Push image to ECR
        run: |
          ECR_REGISTRY=$(aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --query 'repositories[0].repositoryUri' \
            --output text)

          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY:$IMAGE_TAG
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY:staging

          docker push $ECR_REGISTRY:$IMAGE_TAG
          docker push $ECR_REGISTRY:staging
