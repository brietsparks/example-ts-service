name: Promote → Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA)"
        required: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-app

jobs:
  promote:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # ---- AWS auth ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Retag tested image as prod ----
      - name: Retag + push prod image
        run: |
          ECR_REGISTRY=$(aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --query 'repositories[0].repositoryUri' \
            --output text)

          docker pull $ECR_REGISTRY:${{ github.event.inputs.image_tag }}
          docker tag $ECR_REGISTRY:${{ github.event.inputs.image_tag }} $ECR_REGISTRY:prod
          docker push $ECR_REGISTRY:prod
